# OpenAI Configuration for EVAgent RAG System

# OpenAI API Settings
openai:
  # API Key - Leave empty to use OPENAI_API_KEY environment variable
  # Format: "${OPENAI_API_KEY}" for env var substitution, or paste key directly
  api_key: "${OPENAI_API_KEY}"
  
  # Base URL - Optional, defaults to https://api.openai.com/v1
  # Change this for Azure OpenAI or other OpenAI-compatible APIs
  base_url: "https://api.deepseek.com"
  
  # Default model to use
  model: "deepseek-chat"
  
  # Model parameters
  temperature: 0.7
  max_tokens: 2000
  
  # Request settings
  timeout: 60
  max_retries: 3
  
  # Organization ID (optional, for enterprise accounts)
  organization: ""

# Alternative: Azure OpenAI Configuration (uncomment to use)
